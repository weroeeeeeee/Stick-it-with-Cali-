<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stick it with Cali</title>
  <link rel="icon" type="image/png" href="images/ico-siwc.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-contenedor" id="app-contenedor">
    <!-- Escenario con proporciones fijas que escala con la ventana -->
    <div class="escena-fija" id="escena-fija">
      <div class="tablero-contenedor" id="tablero-contenedor">
        <img src="images/tablero.png" alt="Tablero" class="imagen-tablero">
        <img src="images/calendario.png" alt="Calendario" class="imagen-calendario">
        <div class="grid-slots" id="grid-slots"></div>
      </div>

      <img src="images/mesa.png" alt="Mesa" class="imagen-mesa">
      <img src="images/marcadores.png" alt="Marcadores" class="imagen-marcadores">

      <div class="cali-animado" id="cali-animado" aria-label="Cali">
        <img src="images/cola-cali.png" alt="" class="cali-parte cali-cola">
        <img src="images/torso-cali.png" alt="" class="cali-parte cali-torso">
        <img src="images/brazo-der-cali.png" alt="" class="cali-parte cali-brazo-der">
        <img src="images/brazo-izq-cali.png" alt="" class="cali-parte cali-brazo-izq">
        <img src="images/cabeza-cali.png" alt="" class="cali-parte cali-cabeza">
        <img src="images/oreja-der-cali.png" alt="" class="cali-parte cali-oreja-der">
        <img src="images/oreja-izq-cali.png" alt="" class="cali-parte cali-oreja-izq">
        <img src="images/nariz-cali.png" alt="" class="cali-parte cali-nariz">
        <div class="cali-ojos-grupo">
          <img src="images/ojo-der-cali.png" alt="" class="cali-parte cali-ojo-der">
          <img src="images/ojo-izq-cali.png" alt="" class="cali-parte cali-ojo-izq">
        </div>
      </div>

      <img src="images/ordenador.png" alt="Ordenador" class="imagen-ordenador">
      <img src="images/notas.png" alt="Notas" class="imagen-icono-notas" id="btn-abrir-menu">
    </div>

    <!-- Menú de notas -->
    <div class="menu-nota-overlay oculto" id="menu-nota-overlay">
      <div class="menu-nota-container">
        <input type="text" id="input-titulo" class="input-titulo-nota" value="enfoque de hoy">
        <div class="lista-tareas-menu" id="lista-tareas-menu">
          <div class="tarea-item-menu">
            <input type="checkbox">
            <div class="input-anim-container">
              <input type="text" class="txt-menu-nuevo" placeholder="Escribe una tarea...">
            </div>
          </div>
        </div>
        <button class="btn-check-nota" id="btn-check-nota">✓</button>
      </div>
    </div>

    <!-- Menú del calendario -->
    <div class="menu-calendario-overlay oculto" id="menu-calendario-overlay">
      <div class="menu-calendario-container">
        <div class="calendario-hoja-movil" id="calendario-hoja-movil">
          <div class="calendario-header">
            <button id="btn-mes-anterior" class="btn-mes">&lt;</button>
            <div class="calendario-titulos-centro" id="calendario-titulos-centro" title="Elegir mes y año">
              <div id="calendario-anio" class="calendario-anio"></div>
              <div id="calendario-titulo-mes" class="calendario-titulo-mes"></div>
            </div>
            <button id="btn-mes-siguiente" class="btn-mes">&gt;</button>
          </div>

          <div class="selector-mes-anio oculto" id="selector-mes-anio">
            <div class="selector-anio-barra">
              <button type="button" id="btn-anio-menos" class="btn-mes-peq">&lt;</button>
              <input type="number" id="input-selector-anio" class="input-selector-anio" min="1900" max="2100">
              <button type="button" id="btn-anio-mas" class="btn-mes-peq">&gt;</button>
            </div>
            <div class="grid-meses-selector" id="grid-meses-selector"></div>
            <button type="button" id="btn-cerrar-selector-fecha" class="btn-cerrar-selector">Volver</button>
          </div>

          <div class="dias-semana-grande" id="dias-semana-grande"></div>
          <div class="dias-cuadricula-grande" id="dias-cuadricula-grande"></div>

          <div class="calendario-panel-dia oculto" id="calendario-panel-dia">
            <div class="calendario-panel-header">
              <button type="button" id="btn-cerrar-panel-dia" class="btn-cerrar-panel-dia" title="Volver">←</button>
              <span id="calendario-fecha-seleccionada" class="calendario-fecha-seleccionada"></span>
            </div>
            <div class="calendario-form-marcar">
              <input type="text" id="input-nuevo-marcado" class="input-nuevo-marcado" placeholder="Marcar algo en esta fecha..." maxlength="80">
              <button type="button" id="btn-agregar-marcado" class="btn-agregar-marcado">+</button>
            </div>
            <div class="calendario-lista-marcados" id="calendario-lista-marcados"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
